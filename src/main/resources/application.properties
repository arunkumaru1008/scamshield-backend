spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:scamshield_db}?sslMode=${DB_SSL:PREFERRED}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always


spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
spring.datasource.hikari.maximum-pool-size=3
scamshield.tesseract.path=tesseract

jwt.secret=${JWT_SECRET:change-this-to-a-long-random-text-at-least-64-characters-long-1234567890}
jwt.expiration-ms=86400000

logging.level.org.springframework.security=DEBUG

